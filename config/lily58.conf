# Product identity shown to Bluetooth hosts.
CONFIG_ZMK_KEYBOARD_NAME="Allium58"

# The purchased variant has Sharp Memory-in-Pixel displays. The build matrix
# adds nice_view_adapter before nice_view to replace Lily58's stock OLED.
CONFIG_ZMK_DISPLAY=y

# Idle quickly, then enter deep sleep after 30 minutes. Any key wakes it.
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
CONFIG_ZMK_BATTERY_REPORTING=y

# Save the QWERTY/Colemak/Dvorak selection made on Adjust to flash.
CONFIG_ZMK_BEHAVIOR_PDF=y
